<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お手伝い＆お小遣い管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { 
            border-bottom: 2px solid #3b82f6; 
            color: #3b82f6; 
            font-weight: bold; 
            background-color: #eff6ff;
        }
        .tab-btn { color: #6b7280; transition: all 0.2s; }
        
        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 z-50 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-gray-600 font-medium">データを読み込み中...</p>
    </div>

    <div class="max-w-5xl mx-auto bg-white shadow-xl min-h-screen flex flex-col relative">
        <!-- Header -->
        <header class="bg-blue-500 text-white p-4 text-center shadow-md relative z-10">
            <h1 class="text-xl font-bold"><i class="fas fa-piggy-bank mr-2"></i>お小遣い管理</h1>
        </header>

        <!-- Tabs Navigation -->
        <div class="flex border-b bg-white relative z-10 sticky top-0">
            <button onclick="switchTab('record')" id="tab-record" class="tab-btn active flex-1 py-3 text-sm flex flex-col items-center justify-center gap-1">
                <i class="fas fa-pen"></i><span>記録</span>
            </button>
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn flex-1 py-3 text-sm flex flex-col items-center justify-center gap-1">
                <i class="fas fa-chart-pie"></i><span>グラフ</span>
            </button>
            <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn flex-1 py-3 text-sm flex flex-col items-center justify-center gap-1">
                <i class="fas fa-cog"></i><span>設定</span>
            </button>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 overflow-y-auto pb-20">

            <!-- ================= TAB 1: 記録 ================= -->
            <div id="content-record" class="tab-content active">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-white p-4 rounded-xl border border-blue-100 shadow-sm h-fit">
                        <h2 class="text-md font-bold mb-4 text-blue-600 border-b pb-2"><i class="fas fa-plus-circle mr-1"></i> 新しく記録する</h2>
                        <form id="recordForm" class="space-y-4">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">日付</label>
                                <input type="date" id="recordDate" class="w-full border rounded-lg p-2 bg-gray-50 focus:outline-blue-500" required>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">だれが？</label>
                                <select id="recordMember" class="w-full border rounded-lg p-2 bg-gray-50 focus:outline-blue-500" required>
                                    <option value="">メンバーを選択...</option>
                                    <!-- JSで追加 -->
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">なにをした？</label>
                                <select id="recordChore" class="w-full border rounded-lg p-2 bg-gray-50 focus:outline-blue-500" required>
                                    <option value="">お手伝いを選択...</option>
                                    <!-- JSで追加 -->
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg shadow transition-colors">
                                記録を追加
                            </button>
                        </form>
                    </div>

                    <div>
                        <h2 class="text-md font-bold mb-3 text-gray-700">最近の記録</h2>
                        <div id="recentRecordsList" class="space-y-2 max-h-[60vh] overflow-y-auto pr-2">
                            <!-- JSで追加 -->
                            <p class="text-center text-gray-400 text-sm py-4">記録がありません</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= TAB 2: ダッシュボード ================= -->
            <div id="content-dashboard" class="tab-content space-y-6">
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg border max-w-md mx-auto">
                    <button onclick="changeMonth(-1)" class="p-2 text-gray-500 hover:text-blue-500"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="currentMonthDisplay" class="text-lg font-bold text-gray-800">2023年10月</h2>
                    <button onclick="changeMonth(1)" class="p-2 text-gray-500 hover:text-blue-500"><i class="fas fa-chevron-right"></i></button>
                </div>

                <!-- メンバー別サマリー -->
                <div id="summaryCards" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <!-- JSで追加 -->
                </div>

                <!-- グラフ -->
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-white p-3 rounded-xl border shadow-sm">
                        <h3 class="text-sm font-bold text-gray-600 mb-2 text-center">お小遣い獲得額（円）</h3>
                        <div class="relative h-48 w-full">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="bg-white p-3 rounded-xl border shadow-sm">
                        <h3 class="text-sm font-bold text-gray-600 mb-2 text-center">よくやったお手伝い（全体）</h3>
                        <div class="relative h-48 w-full">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- AIほめ言葉 -->
                <div class="bg-gradient-to-r from-yellow-50 to-orange-50 p-4 rounded-xl border border-yellow-200 shadow-sm mt-6">
                    <h3 class="text-md font-bold text-yellow-700 mb-2"><i class="fas fa-sparkles mr-2"></i>AIからのほめ言葉 ✨</h3>
                    <p class="text-sm text-gray-600 mb-3">今月のがんばりをAIが分析して、特別なメッセージを贈ります！モチベーションアップに！</p>
                    <button onclick="generatePraise()" id="btnGeneratePraise" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 px-4 rounded shadow transition-colors text-sm">
                        メッセージを生成する
                    </button>
                    <div id="praiseResult" class="mt-4 text-gray-800 font-medium whitespace-pre-wrap hidden p-4 bg-white rounded-lg border border-yellow-200 shadow-inner"></div>
                </div>
            </div>

            <!-- ================= TAB 3: 設定 ================= -->
            <div id="content-settings" class="tab-content">
                <div class="grid md:grid-cols-2 gap-8">
                    <!-- メンバー設定 -->
                    <div>
                        <h2 class="text-md font-bold mb-3 text-gray-700 flex items-center"><i class="fas fa-users mr-2 text-blue-500"></i>メンバー管理</h2>
                        <form id="memberForm" class="flex gap-2 mb-4">
                            <input type="text" id="newMemberName" placeholder="名前 (例: たろう)" class="flex-1 border rounded-lg p-2 bg-gray-50" required>
                            <button type="submit" class="bg-blue-500 text-white px-4 rounded-lg font-bold"><i class="fas fa-plus"></i></button>
                        </form>
                        <div id="membersList" class="space-y-2">
                            <!-- JSで追加 -->
                        </div>
                    </div>

                    <!-- お手伝い設定 -->
                    <div>
                        <h2 class="text-md font-bold mb-3 text-gray-700 flex items-center"><i class="fas fa-broom mr-2 text-green-500"></i>お手伝いマスター</h2>
                        <form id="choreForm" class="space-y-2 mb-4 bg-gray-50 p-3 rounded-lg border">
                            <input type="text" id="newChoreName" placeholder="項目名 (例: お風呂掃除)" class="w-full border rounded-lg p-2" required>
                            <div class="flex gap-2">
                                <input type="number" id="newChorePrice" placeholder="単価 (円)" class="flex-1 border rounded-lg p-2" min="0" required>
                                <button type="submit" class="bg-green-500 text-white px-4 rounded-lg font-bold whitespace-nowrap"><i class="fas fa-plus mr-1"></i>追加</button>
                            </div>
                        </form>

                        <!-- AIアイデア提案 -->
                        <div class="mb-4 bg-purple-50 p-4 rounded-xl border border-purple-100 shadow-sm">
                            <h3 class="text-sm font-bold text-purple-700 mb-2"><i class="fas fa-lightbulb mr-1"></i>AIにお手伝いのアイデアを相談 ✨</h3>
                            <p class="text-xs text-purple-600 mb-2">年齢や季節などを入力すると、おすすめのお手伝いと単価を提案します。</p>
                            <div class="flex gap-2 mb-2">
                                <input type="text" id="aiIdeaContext" placeholder="例: 5歳くらい、夏休み" class="flex-1 text-sm border rounded-lg p-2 focus:outline-purple-500">
                                <button onclick="generateIdeas()" id="btnGenerateIdeas" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-lg shadow transition-colors text-sm whitespace-nowrap">
                                    提案
                                </button>
                            </div>
                            <div id="aiIdeasResult" class="space-y-2 hidden mt-3">
                                <!-- JSで追加 -->
                            </div>
                        </div>

                        <div id="choresList" class="space-y-2">
                            <!-- JSで追加 -->
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase SDK (ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // === アプリの状態 ===
        let members = [];
        let chores = [];
        let records = [];
        let viewMonth = new Date();
        let barChartInstance = null;
        let pieChartInstance = null;
        const THEME_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

        // DOM要素
        const recordDateInput = document.getElementById('recordDate');
        recordDateInput.value = new Date().toISOString().split('T')[0];

        // === タブ切り替え関数 ===
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('content-' + tabId).classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
            
            if(tabId === 'dashboard') {
                renderDashboard();
            }
        };

        // === 月切り替え関数 ===
        window.changeMonth = function(delta) {
            viewMonth.setMonth(viewMonth.getMonth() + delta);
            renderDashboard();
        };

        // === Firebaseの初期化 ===
        let db, auth, currentAppId, publicDataPath;

        const initFirebase = async () => {
            try {
                // 環境変数のチェック (Canvas環境用)
                if (typeof __firebase_config === 'undefined') {
                    throw new Error("Firebase設定が見つかりません。");
                }

                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                // 認証処理
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // 認証状態の監視
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        publicDataPath = `artifacts/${currentAppId}/public/data`;
                        setupRealtimeListeners();
                    }
                });

            } catch (error) {
                console.error("Firebase初期化エラー:", error);
                alert("データベースの接続に失敗しました。この環境では動作しない可能性があります。");
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        };

        // === リアルタイムリスナーの設定 ===
        function setupRealtimeListeners() {
            let loadedCount = 0;
            const checkReady = () => {
                loadedCount++;
                if(loadedCount >= 3) {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    updateAllUI();
                }
            };

            // メンバーの監視
            onSnapshot(collection(db, publicDataPath, 'members'), (snapshot) => {
                members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateAllUI();
                if(loadedCount < 3) checkReady();
            }, (error) => console.error(error));

            // お手伝い項目の監視
            onSnapshot(collection(db, publicDataPath, 'chores'), (snapshot) => {
                chores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateAllUI();
                if(loadedCount < 3) checkReady();
            }, (error) => console.error(error));

            // 記録の監視
            onSnapshot(collection(db, publicDataPath, 'records'), (snapshot) => {
                records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // 日付の降順（新しい順）にソート
                records.sort((a, b) => new Date(b.date) - new Date(a.date));
                updateAllUI();
                if(loadedCount < 3) checkReady();
            }, (error) => console.error(error));
        }

        // === UI更新を一括で行う ===
        function updateAllUI() {
            renderSelectOptions();
            renderRecentRecords();
            renderMembersList();
            renderChoresList();
            if(document.getElementById('content-dashboard').classList.contains('active')){
                renderDashboard();
            }
        }

        // === セレクトボックスの描画 ===
        function renderSelectOptions() {
            const memberSelect = document.getElementById('recordMember');
            const currentMemberVal = memberSelect.value;
            memberSelect.innerHTML = '<option value="">メンバーを選択...</option>' + 
                members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
            if (members.find(m => m.id === currentMemberVal)) memberSelect.value = currentMemberVal;

            const choreSelect = document.getElementById('recordChore');
            const currentChoreVal = choreSelect.value;
            choreSelect.innerHTML = '<option value="">お手伝いを選択...</option>' + 
                chores.map(c => `<option value="${c.id}">${c.name} (${c.price}円)</option>`).join('');
            if (chores.find(c => c.id === currentChoreVal)) choreSelect.value = currentChoreVal;
        }

        // === 記録の追加と削除 ===
        document.getElementById('recordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('recordDate').value;
            const memberId = document.getElementById('recordMember').value;
            const choreId = document.getElementById('recordChore').value;
            
            const chore = chores.find(c => c.id === choreId);
            if(!chore || !memberId) return;

            try {
                await addDoc(collection(db, publicDataPath, 'records'), {
                    date: date,
                    memberId: memberId,
                    choreId: choreId,
                    choreName: chore.name,
                    price: Number(chore.price),
                    timestamp: new Date().getTime()
                });
                
                // フォームのリセット（日付は保持）
                document.getElementById('recordMember').value = '';
                document.getElementById('recordChore').value = '';
                
            } catch (error) {
                console.error("追加エラー", error);
            }
        });

        window.deleteRecord = async function(id) {
            try {
                await deleteDoc(doc(db, publicDataPath, 'records', id));
            } catch (error) {
                console.error("削除エラー", error);
            }
        };

        // === 最近の記録一覧の描画 ===
        function renderRecentRecords() {
            const container = document.getElementById('recentRecordsList');
            if (records.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">まだ記録がありません</p>';
                return;
            }

            // 最新20件を表示
            container.innerHTML = records.slice(0, 20).map(record => {
                const member = members.find(m => m.id === record.memberId);
                const memberName = member ? member.name : '不明なメンバー';
                const color = member ? member.color : '#9ca3af';
                
                // 日付のフォーマット (MM/DD)
                const dateObj = new Date(record.date);
                const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()}`;

                return `
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold" style="background-color: ${color}">
                            ${memberName.charAt(0)}
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-800">${record.choreName}</p>
                            <p class="text-xs text-gray-500">${dateStr} · ${memberName}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-blue-600 font-bold text-sm">+${record.price}円</span>
                        <button onclick="deleteRecord('${record.id}')" class="text-gray-400 hover:text-red-500 p-1">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // === メンバーの追加と削除 ===
        document.getElementById('memberForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('newMemberName');
            const name = nameInput.value.trim();
            if(!name) return;

            const color = THEME_COLORS[members.length % THEME_COLORS.length];
            
            try {
                await addDoc(collection(db, publicDataPath, 'members'), { name, color });
                nameInput.value = '';
            } catch (error) {
                console.error("メンバー追加エラー", error);
            }
        });

        window.deleteMember = async function(id) {
            if(confirm("このメンバーを削除しますか？\n（過去の記録の表示がおかしくなる場合があります）")) {
                try {
                    await deleteDoc(doc(db, publicDataPath, 'members', id));
                } catch (error) {
                    console.error("メンバー削除エラー", error);
                }
            }
        };

        function renderMembersList() {
            const container = document.getElementById('membersList');
            if(members.length === 0){
                container.innerHTML = '<p class="text-sm text-gray-400">メンバーを追加してください</p>';
                return;
            }
            container.innerHTML = members.map(m => `
                <div class="flex items-center justify-between p-2 bg-white rounded border">
                    <div class="flex items-center gap-2">
                        <span class="w-4 h-4 rounded-full" style="background-color: ${m.color}"></span>
                        <span class="font-medium">${m.name}</span>
                    </div>
                    <button onclick="deleteMember('${m.id}')" class="text-red-400 hover:text-red-600"><i class="fas fa-times"></i></button>
                </div>
            `).join('');
        }

        // === お手伝い項目の追加と削除 ===
        document.getElementById('choreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('newChoreName');
            const priceInput = document.getElementById('newChorePrice');
            const name = nameInput.value.trim();
            const price = Number(priceInput.value);
            
            if(!name || price < 0) return;

            try {
                await addDoc(collection(db, publicDataPath, 'chores'), { name, price });
                nameInput.value = '';
                priceInput.value = '';
            } catch (error) {
                console.error("お手伝い追加エラー", error);
            }
        });

        window.deleteChore = async function(id) {
            try {
                await deleteDoc(doc(db, publicDataPath, 'chores', id));
            } catch (error) {
                console.error("お手伝い削除エラー", error);
            }
        };

        function renderChoresList() {
            const container = document.getElementById('choresList');
            if(chores.length === 0){
                container.innerHTML = '<p class="text-sm text-gray-400">お手伝いを追加してください</p>';
                return;
            }
            container.innerHTML = chores.map(c => `
                <div class="flex items-center justify-between p-2 bg-white rounded border">
                    <span class="font-medium">${c.name}</span>
                    <div class="flex items-center gap-3">
                        <span class="text-gray-600">${c.price}円</span>
                        <button onclick="deleteChore('${c.id}')" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // === ダッシュボード（グラフ）の描画 ===
        function renderDashboard() {
            const year = viewMonth.getFullYear();
            const month = viewMonth.getMonth() + 1;
            document.getElementById('currentMonthDisplay').textContent = `${year}年 ${month}月`;

            const monthStr = `${year}-${String(month).padStart(2, '0')}`;
            
            // 当月の記録を抽出
            const currentRecords = records.filter(r => r.date.startsWith(monthStr));

            // サマリー計算
            const summaryData = {};
            members.forEach(m => {
                summaryData[m.id] = { name: m.name, color: m.color, totalAmount: 0, count: 0 };
            });

            const choreCounts = {};

            currentRecords.forEach(r => {
                // メンバー別集計
                if(summaryData[r.memberId]) {
                    summaryData[r.memberId].totalAmount += r.price;
                    summaryData[r.memberId].count += 1;
                }
                // お手伝い種類別集計
                choreCounts[r.choreName] = (choreCounts[r.choreName] || 0) + 1;
            });

            // サマリーカードの描画
            const cardsContainer = document.getElementById('summaryCards');
            if(members.length === 0) {
                cardsContainer.innerHTML = '<p class="col-span-2 text-center text-sm text-gray-500 py-4">メンバーを登録してください</p>';
            } else {
                cardsContainer.innerHTML = Object.values(summaryData).map(data => `
                    <div class="bg-white p-3 rounded-xl border shadow-sm flex flex-col items-center">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold mb-1" style="background-color: ${data.color}">
                            ${data.name.charAt(0)}
                        </div>
                        <p class="text-xs text-gray-500">${data.name}</p>
                        <p class="text-lg font-bold text-blue-600">${data.totalAmount}円</p>
                        <p class="text-xs text-gray-400">${data.count}回</p>
                    </div>
                `).join('');
            }

            // --- 棒グラフ（お小遣い額比較）---
            const barCtx = document.getElementById('barChart').getContext('2d');
            if(barChartInstance) barChartInstance.destroy();

            const chartMembers = Object.values(summaryData);
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: chartMembers.map(m => m.name),
                    datasets: [{
                        label: '獲得金額（円）',
                        data: chartMembers.map(m => m.totalAmount),
                        backgroundColor: chartMembers.map(m => m.color),
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            // --- 円グラフ（お手伝い内訳）---
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            if(pieChartInstance) pieChartInstance.destroy();

            const pieLabels = Object.keys(choreCounts);
            const pieData = Object.values(choreCounts);

            if (pieLabels.length > 0) {
                pieChartInstance = new Chart(pieCtx, {
                    type: 'doughnut',
                    data: {
                        labels: pieLabels,
                        datasets: [{
                            data: pieData,
                            backgroundColor: ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } } }
                    }
                });
            } else {
                 pieChartInstance = new Chart(pieCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['データなし'],
                        datasets: [{ data: [1], backgroundColor: ['#e5e7eb'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip:{enabled:false} } }
                });
            }
        }

        // === Gemini API 関連処理 ===
        const apiKey = "";

        async function fetchWithRetry(url, options, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        async function callGeminiAPI(prompt, schema = null) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            
            if (schema) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: schema
                };
            }

            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            };

            const data = await fetchWithRetry(url, options);
            return data.candidates[0].content.parts[0].text;
        }

        // AIほめ言葉の生成
        window.generatePraise = async function() {
            const btn = document.getElementById('btnGeneratePraise');
            const resultDiv = document.getElementById('praiseResult');
            
            const year = viewMonth.getFullYear();
            const month = viewMonth.getMonth() + 1;
            const monthStr = `${year}-${String(month).padStart(2, '0')}`;
            const currentRecords = records.filter(r => r.date.startsWith(monthStr));

            if(currentRecords.length === 0 || members.length === 0) {
                resultDiv.innerHTML = '<span class="text-orange-600">記録が見つかりません。お手伝いを記録してから試してみてね！</span>';
                resultDiv.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>生成中...';
            resultDiv.classList.add('hidden');

            let summaryText = "";
            members.forEach(m => {
                const memberRecords = currentRecords.filter(r => r.memberId === m.id);
                const total = memberRecords.reduce((sum, r) => sum + r.price, 0);
                summaryText += `${m.name}さん: ${memberRecords.length}回のお手伝いをしました。獲得したお小遣い合計は${total}円です。\n`;
            });

            const prompt = `あなたは子供を褒めて伸ばす優しい妖精のキャラクターです。
以下の今月（${month}月）のお手伝い記録を見て、子供たちをめちゃくちゃ褒めるメッセージを作成してください。
子供たちが「来月も頑張ろう！」と思えるような、明るく楽しいトーンでお願いします。絵文字もたくさん使ってください。

【今月の記録】
${summaryText}

条件：
・メッセージは200文字程度に収めてください。
・子供たち全員の名前を呼んで、直接語りかけるように書いてください。`;

            try {
                const text = await callGeminiAPI(prompt);
                resultDiv.textContent = text;
                resultDiv.classList.remove('hidden');
            } catch (error) {
                console.error("Gemini API Error:", error);
                resultDiv.innerHTML = '<span class="text-red-500">メッセージの生成に失敗しました。時間をおいてもう一度お試しください。</span>';
                resultDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'メッセージを生成する';
            }
        };

        // AIアイデアの提案
        window.generateIdeas = async function() {
            const contextInput = document.getElementById('aiIdeaContext').value.trim() || '一般的な年齢';
            const btn = document.getElementById('btnGenerateIdeas');
            const resultDiv = document.getElementById('aiIdeasResult');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>考え中';
            resultDiv.innerHTML = '<p class="text-xs text-purple-600 text-center py-2"><i class="fas fa-magic fa-bounce mr-2"></i>AIが一生懸命考えています...</p>';
            resultDiv.classList.remove('hidden');

            const prompt = `家事の助けになり、子供の成長にもつながる子供向けのお手伝いのアイデアを3つ提案してください。
ターゲットの年齢や状況: ${contextInput}
相場として妥当な「お小遣い単価（円）」も設定してください。`;

            const schema = {
                type: "ARRAY",
                items: {
                    type: "OBJECT",
                    properties: {
                        name: { type: "STRING", description: "お手伝いの名前（短く簡潔に、例：お風呂掃除）" },
                        price: { type: "INTEGER", description: "お小遣いの単価の数値（円）" }
                    },
                    required: ["name", "price"]
                }
            };

            try {
                const jsonText = await callGeminiAPI(prompt, schema);
                const ideas = JSON.parse(jsonText);
                
                resultDiv.innerHTML = ideas.map((idea, index) => `
                    <div class="flex items-center justify-between bg-white p-2 rounded-lg border border-purple-200 text-sm shadow-sm">
                        <span class="font-medium text-gray-700 ml-2"><i class="fas fa-star text-yellow-400 mr-2"></i>${idea.name} <span class="text-gray-500 text-xs">(${idea.price}円)</span></span>
                        <button onclick="addChoreFromAI('${idea.name}', ${idea.price}, this)" class="text-purple-600 hover:text-purple-800 font-bold px-3 py-1.5 rounded bg-purple-100 hover:bg-purple-200 transition-colors">
                            追加
                        </button>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error("Gemini API Error:", error);
                resultDiv.innerHTML = '<p class="text-xs text-red-500 py-2">アイデアの取得に失敗しました。時間をおいてお試しください。</p>';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '提案';
            }
        };

        window.addChoreFromAI = async function(name, price, btnElement) {
            try {
                btnElement.disabled = true;
                btnElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                await addDoc(collection(db, publicDataPath, 'chores'), { name, price });
                btnElement.innerHTML = '追加済 <i class="fas fa-check"></i>';
                btnElement.classList.remove('text-purple-600', 'bg-purple-100', 'hover:bg-purple-200');
                btnElement.classList.add('text-green-600', 'bg-green-100');
            } catch (error) {
                console.error("お手伝い追加エラー", error);
                btnElement.disabled = false;
                btnElement.innerHTML = 'エラー';
            }
        };

        // 起動処理
        initFirebase();

    </script>
